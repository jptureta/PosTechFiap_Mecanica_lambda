version = 0.1

[default]
[default.global.parameters]
stack_name = "oficina-lambda"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
region = "us-east-1"

[homologacao]
[homologacao.deploy.parameters]
stack_name = "oficina-lambda-homologacao"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = false

[production]
[production.deploy.parameters]
stack_name = "oficina-lambda-production"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
# Substitua pelos domínios reais que consomem a API em produção.
# Aceita mais de um separado por vírgula (sem espaços):
#   parameter_overrides = "AllowedOrigins=https://app.oficina.com,https://admin.oficina.com"
parameter_overrides = "AllowedOrigins=https://app.oficina.com"
