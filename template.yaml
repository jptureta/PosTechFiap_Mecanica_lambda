AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Oficina Mecânica Lambda - Autenticação por CPF + API Gateway

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        DB_HOST: !Ref DbHost
        DB_PORT: !Ref DbPort
        DB_NAME: !Ref DbName
        DB_USER: !Ref DbUser
        DB_PASSWORD: !Ref DbPassword
        JWT_SECRET_KEY: !Ref JwtSecretKey
        JWT_ALGORITHM: HS256
        JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"

Parameters:
  DbHost:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /oficina/db/host
    Description: Host do banco de dados PostgreSQL
  DbPort:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /oficina/db/port
    Description: Porta do banco de dados PostgreSQL
  DbName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /oficina/db/name
    Description: Nome do banco de dados
  DbUser:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /oficina/db/user
    Description: Usuário do banco de dados
  DbPassword:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /oficina/db/password
    Description: Senha do banco de dados no SSM
  JwtSecretKey:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /oficina/jwt/secret_key
    Description: Chave secreta JWT — deve ser idêntica à usada pela API principal

  # ─────────────────────────────────────────────────────────
  # Parâmetros do NLB / VPC Link (publicados pelo Terraform
  # do repositório k8s-infra no SSM Parameter Store).
  # ─────────────────────────────────────────────────────────
  NlbListenerArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /oficina/nlb/listener_arn
    Description: ARN do listener HTTP do NLB — alvo do integration para o EKS
  VpcSubnetIds:
    Type: AWS::SSM::Parameter::Value<List<String>>
    Default: /oficina/vpc/subnet_ids
    Description: Subnets onde o VPC Link cria suas ENIs (mesma VPC do EKS)
  VpcLinkSecurityGroupId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /oficina/vpc/link_security_group_id
    Description: Security Group das ENIs do VPC Link

Resources:
  # ─────────────────────────────────────────────────────────────
  # HTTP API Gateway — ponto de entrada público da aplicação
  # ─────────────────────────────────────────────────────────────
  OficinaMecanicaApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      Description: API Gateway da Oficina Mecânica — roteia para Lambda e app principal
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
          - X-Request-ID
        MaxAge: 300

  # ─────────────────────────────────────────────────────────────
  # Função Lambda principal
  # ─────────────────────────────────────────────────────────────
  OficinaMecanicaFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      CodeUri: src/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Description: "Healthcheck e autenticação de clientes via CPF com geração de JWT"
      Events:
        # Rota pública — sem autorizador
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref OficinaMecanicaApi
            Path: /health
            Method: GET

        # Rota pública — gera token JWT a partir do CPF
        AuthCpf:
          Type: HttpApi
          Properties:
            ApiId: !Ref OficinaMecanicaApi
            Path: /auth/cpf
            Method: POST

  # ─────────────────────────────────────────────────────────────
  # Integração da aplicação FastAPI no EKS via VPC Link
  #
  # O API Gateway roda fora da VPC — o VPC Link é o "cabo"
  # gerenciado que dá a ele uma ENI dentro da VPC do cluster
  # para alcançar o NLB, que por sua vez encaminha ao NodePort
  # do Service da API.
  #
  # Fluxo: Cliente → API Gateway → VPC Link → NLB → NodePort → Pod
  # ─────────────────────────────────────────────────────────────

  # VPC Link — cria ENIs nas subnets do EKS
  OficinaMecanicaVpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: !Sub "${AWS::StackName}-vpc-link"
      SubnetIds: !Ref VpcSubnetIds
      SecurityGroupIds:
        - !Ref VpcLinkSecurityGroupId

  # Integração HTTP_PROXY apontando para o listener do NLB
  ApiAppIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref OficinaMecanicaApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      ConnectionType: VPC_LINK
      ConnectionId: !Ref OficinaMecanicaVpcLink
      IntegrationUri: !Ref NlbListenerArn
      PayloadFormatVersion: "1.0"

  # Rota catch-all: qualquer caminho não capturado pelas rotas
  # exatas da Lambda (/health, /auth/cpf) vai para a aplicação.
  # Inclui /api/v1/*, /docs, /openapi.json, /redoc, /metrics.
  ApiAppRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OficinaMecanicaApi
      RouteKey: "ANY /{proxy+}"
      Target: !Sub "integrations/${ApiAppIntegration}"

Outputs:
  ApiGatewayUrl:
    Description: "URL base do AWS API Gateway"
    Value: !Sub "https://${OficinaMecanicaApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Export:
      Name: !Sub "${AWS::StackName}-ApiGatewayUrl"

  AuthEndpoint:
    Description: "Endpoint de autenticação por CPF"
    Value: !Sub "https://${OficinaMecanicaApi}.execute-api.${AWS::Region}.amazonaws.com/prod/auth/cpf"

  HealthEndpoint:
    Description: "Endpoint de healthcheck da Lambda"
    Value: !Sub "https://${OficinaMecanicaApi}.execute-api.${AWS::Region}.amazonaws.com/prod/health"

  ApiAppBaseUrl:
    Description: "URL base da aplicação FastAPI (rotas /api/v1/*, /docs, /openapi.json)"
    Value: !Sub "https://${OficinaMecanicaApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  SwaggerUrl:
    Description: "Swagger UI da aplicação, servida pelo API Gateway"
    Value: !Sub "https://${OficinaMecanicaApi}.execute-api.${AWS::Region}.amazonaws.com/prod/docs"

  LambdaFunctionArn:
    Description: "ARN da função Lambda"
    Value: !GetAtt OficinaMecanicaFunction.Arn

  VpcLinkId:
    Description: "ID do VPC Link criado para integrar o gateway ao EKS"
    Value: !Ref OficinaMecanicaVpcLink
