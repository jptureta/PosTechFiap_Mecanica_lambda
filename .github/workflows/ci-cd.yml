name: Lambda CI/CD

on:
  pull_request:
    branches: ["main", "homologacao"]
  push:
    branches: ["main", "homologacao"]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest boto3
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests
        run: pytest -q

  deploy-homologacao:
    name: Deploy Homologação
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/homologacao'
    runs-on: ubuntu-latest
    environment: homologacao
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install AWS SAM CLI
        run: |
          pip install aws-sam-cli

      - name: Build Lambda
        run: sam build

      - name: Deploy Lambda to homologation
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --stack-name oficina-lambda-homologacao --resolve-s3 --config-env homologacao

  deploy-production:
    name: Deploy Produção
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install AWS SAM CLI
        run: |
          pip install aws-sam-cli

      - name: Build Lambda
        run: sam build

      - name: Deploy Lambda to production
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --stack-name oficina-lambda-production --resolve-s3 --config-env production
